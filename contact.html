    <div class="page-wrapper">
        <div class="contact-container">
            <h1 class="contact-title">Get in Touch</h1>

            <form action="https://formspree.io/f/xrbrqoqb" method="POST" class="contact-form">
                <div class="form-grid">
                    <!-- Left Column - Basic Info -->
                    <div class="form-column left-column">
                        <!-- Name Field -->
                        <div class="form-group">
                            <label class="form-label" for="name">Full Name *</label>
                            <input type="text" id="name" name="name" class="form-input" placeholder="Enter your full name" required>
                        </div>

                        <!-- Role Selection -->
                        <div class="form-group">
                            <label class="form-label" for="role">I am a *</label>
                            <select id="role" name="role" class="form-select" required>
                                <option value="" disabled selected>Select your role</option>
                                <option value="student">Student</option>
                                <option value="teacher">Teacher</option>
                                <option value="admin">Administrator</option>
                                <option value="parent">Parent</option>
                                <option value="other">Other</option>
                            </select>
                        </div>

                        <!-- Email Field -->
                        <div class="form-group">
                            <label class="form-label" for="email">Email Address *</label>
                            <input type="email" id="email" name="email" class="form-input" placeholder="Enter your email address" required>
                        </div>

                        <!-- Phone Field -->
                        <div class="form-group">
                            <label class="form-label" for="phone">Phone Number (Optional)</label>
                            <input type="tel" id="phone" name="phone" class="form-input" placeholder="Enter your phone number">
                        </div>

                        <!-- School/Organization Field -->
                        <div class="form-group">
                            <label class="form-label" for="organization">School/Organization (Optional)</label>
                            <input type="text" id="organization" name="organization" class="form-input" placeholder="Enter your school or organization">
                        </div>
                    </div>

                    <!-- Right Column - Subject and Message -->
                    <div class="form-column right-column">
                        <!-- Subject Field -->
                        <div class="form-group">
                            <label class="form-label" for="subject">Subject</label>
                            <input type="text" id="subject" name="subject" class="form-input" placeholder="What is this regarding?">
                        </div>

                        <!-- Message Field -->
                        <div class="form-group message-group">
                            <label class="form-label" for="message">Message *</label>
                            <textarea id="message" name="message" class="form-textarea" placeholder="Tell us how we can help you..." required></textarea>
                        </div>
                    </div>
                </div>

                <!-- Bottom Center - Newsletter and Submit -->
                <div class="form-bottom">
                    <!-- Newsletter Subscription -->
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="newsletter" name="newsletter" value="yes" class="form-checkbox">
                            <span class="checkbox-text">Subscribe to our newsletter for updates</span>
                        </label>
                    </div>

                    <!-- Hidden field for form identification -->
                    <input type="hidden" name="_subject" value="New Contact Form Submission">

                    <!-- Submit Button -->
                    <button type="submit" class="submit-btn">Send Message</button>

                    <!-- Success Message -->
                    <div class="success-message">
                        <p>Thank you for your message! We'll get back to you soon.</p>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script>
        // Mobile Menu Toggle
        const mobileMenuToggle = document.querySelector('.mobile-menu-toggle');
        const navMenu = document.querySelector('.nav-menu');
        const dropdownToggles = document.querySelectorAll('.dropdown-toggle');

        // Toggle mobile menu
        mobileMenuToggle.addEventListener('click', () => {
            mobileMenuToggle.classList.toggle('active');
            navMenu.classList.toggle('active');
        });

        // Handle dropdown clicks on mobile
        dropdownToggles.forEach(toggle => {
            toggle.addEventListener('click', (e) => {
                if (window.innerWidth <= 1024) {
                    e.preventDefault();
                    const dropdown = toggle.closest('.nav-dropdown');
                    dropdown.classList.toggle('active');
                }
            });
        });

        // Close mobile menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('.navbar')) {
                navMenu.classList.remove('active');
                mobileMenuToggle.classList.remove('active');
            }
        });

        // Close mobile menu on window resize
        window.addEventListener('resize', () => {
            if (window.innerWidth > 1024) {
                navMenu.classList.remove('active');
                mobileMenuToggle.classList.remove('active');
            }
        });

        // Form submission handling
        const contactForm = document.querySelector('.contact-form');
        const successMessage = document.querySelector('.success-message');

        contactForm.addEventListener('submit', function(e) {
            // Allow form to submit to Formspree
            // Show success message after a brief delay
            setTimeout(() => {
                successMessage.style.display = 'block';
                setTimeout(() => {
                    successMessage.style.display = 'none';
                }, 5000);
            }, 500);
        });
    </script>
